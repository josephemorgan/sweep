# Git hooks, installed by `pnpm install` (lefthook postinstall; skipped when CI=true).
# doublestar: `**/*.ts` also matches files at the repo root.
glob_matcher: doublestar

pre-commit:
  jobs:
    - name: prettier
      glob: '**/*.{ts,js,mjs,cjs,json,html,css,yaml,yml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '**/*.{ts,js,mjs,cjs,html}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: typecheck
      run: pnpm typecheck
    - name: core-tests
      glob: 'packages/core/**'
      run: pnpm --filter @sweep/core test
