name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sweep
          POSTGRES_PASSWORD: sweep
          POSTGRES_DB: sweep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweep -d sweep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sweep:sweep@localhost:5432/sweep
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      BETTER_AUTH_URL: http://localhost:4200
      SIGNUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (root prepare builds @sweep/core)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright chromium
        run: pnpm --filter @sweep/client exec playwright install --with-deps chromium

      - name: E2E (phone + handheld-4x3)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 7
