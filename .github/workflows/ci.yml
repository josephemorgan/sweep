name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sweep
          POSTGRES_PASSWORD: sweep
          POSTGRES_DB: sweep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweep -d sweep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sweep:sweep@localhost:5432/sweep
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      BETTER_AUTH_URL: http://localhost:4200
      SIGNUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (root prepare builds @sweep/core)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Schema drift
        run: pnpm schema && git diff --exit-code -- schema/

      - name: Validate example guides
        run: pnpm validate:examples

      - name: Build
        run: pnpm build

      - name: Install Playwright chromium
        run: pnpm --filter @sweep/client exec playwright install --with-deps chromium

      - name: E2E (phone + handheld-4x3)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the image with Postgres
        run: docker compose up -d --build

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:3000/api/health || true)
            if [ "$body" = '{"ok":true,"db":true}' ]; then
              echo "healthy: $body"
              exit 0
            fi
            sleep 2
          done
          echo "app never became healthy"
          exit 1

      - name: Create a user with the bundled script
        run: printf 'ci-password-123456\n' | docker compose exec -T app node server/dist/scripts/create-user.js --email ci@example.com

      - name: Sign in and dry-run a guide upload
        run: |
          # Origin must be the app's BETTER_AUTH_URL (compose default SWEEP_APP_URL).
          origin=http://localhost:3000
          jar=$(mktemp)
          curl -fsS -o /dev/null -c "$jar" -H "Origin: $origin" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123456"}' \
            http://127.0.0.1:3000/api/auth/sign-in/email
          status=$(curl -sS -o dry-run.json -w '%{http_code}' -b "$jar" -H "Origin: $origin" \
            -F 'file=@guides/examples/lantern-keep.yaml' \
            'http://127.0.0.1:3000/api/runs?dryRun=true')
          if [ "$status" != 200 ]; then
            echo "dry run returned $status"
            cat dry-run.json
            exit 1
          fi
          jq -e '.summary != null' dry-run.json

      - name: Serve the client with no-cache index.html
        run: |
          curl -fsSI http://127.0.0.1:3000/ | grep -i '^cache-control: no-cache'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
