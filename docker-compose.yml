services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sweep
      POSTGRES_PASSWORD: sweep
      POSTGRES_DB: sweep
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sweep -d sweep']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
