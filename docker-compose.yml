services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sweep
      POSTGRES_PASSWORD: sweep
      POSTGRES_DB: sweep
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sweep -d sweep']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://sweep:sweep@postgres:5432/sweep
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0000000000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
