# Pinned so every git worktree under .claude/worktrees/ shares the one `sweep-postgres-1`
# instead of starting a second Postgres that fails to bind 127.0.0.1:5432.
name: sweep

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sweep
      POSTGRES_PASSWORD: sweep
      POSTGRES_DB: sweep
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sweep -d sweep']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://sweep:sweep@postgres:5432/sweep
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0000000000}
      # Not BETTER_AUTH_URL: compose would read the dev value (:4200) from the root .env.
      BETTER_AUTH_URL: ${SWEEP_APP_URL:-http://localhost:3000}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PARSE_TIMEOUT_MS: ${PARSE_TIMEOUT_MS:-}
      PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
